# recipe/speech_server.py settings. Copy to speech-server.ini (git-ignored) and edit; from the repository root:
#   python3 recipe/speech_server.py speech-server.ini
# Relative paths are taken from the directory it starts in.
[server]
# The quant to serve: nvfp4-5900 (the default), the 5,900-expert quant, downloaded with
#   hf download plotarmordev/drama-3-NVFP4-Pruned-5900 --revision 4bfe2c32daa771566970ad385292fab43d060bb8 \
#     --local-dir drama-3-NVFP4-Pruned-5900
# or nvfp4, the 20.8 GB drama-3-NVFP4-Pruned quant. Its checkpoint is verified against its manifest on every start.
weights = nvfp4-5900
checkpoint = drama-3-NVFP4-Pruned-5900
# Optional: a folder of voice files, requested by name: the GB10 host's drama3-voice/1 and /2 files as they are,
# or drama3-http-voice/1 catalogs (recipe/README-macos.md#cloned-voices).
voices = runtime/voices
# Optional, needs voices: the catalog voice a request without a voice gets. Unset: the built-in voice.
default_voice = my-voice
# The speech API. 127.0.0.1 keeps it on this Mac; 0.0.0.0 offers it on the LAN.
host = 127.0.0.1
port = 18793
# The engine behind it, on 127.0.0.1 only.
engine_port = 18794
# Must already exist: the lock every GPU workload on this Mac takes.
gpu_lock = runtime/gpu.lock
runtime_dir = runtime
# Replaced on every start.
evidence_dir = runs/speech-server
# Optional, default false: true starts the engine with --external-admission, with no free-memory floor to start
# and no abort when memory runs low. For a Mac where another model holds most of the memory.
external_admission = false
